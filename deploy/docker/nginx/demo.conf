# 演示宿主页（8083）：SDK 走同源 /v1 → receiver:4318
# （接收端无 CORS，同源代理后 SDK 以相对 endpoint /v1/traces 上报，
#  普通浏览器即可演示，无需 --disable-web-security——见 T23 CORS 缺口记录）
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # OTLP/HTTP 入口：SDK endpoint='/v1/traces'（相对路径，经本代理直达 receiver）
  location /v1/ {
    proxy_pass http://receiver:4318;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 10m;
  }

  # 演示 mock 后端：宿主页的真实 fetch 目标（SDK fetch 包装产生 REST span）
  location /mock-api/ {
    default_type application/json;
    return 200 '{"code":0,"message":"ok","data":{"id":"demo-1"}}';
  }
}
